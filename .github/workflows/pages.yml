# 관람객 웹(web/app/)을 GitHub Pages로 공개한다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 설정하면, main 에 올릴 때마다 자동 배포된다.
# 만들기(build)와 올리기(deploy)를 두 작업으로 나눈다: 같은 작업 안에서 바로 올리면 방금 만든 묶음을 못 찾는 경우가 있다.
name: 웹 공개 (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/app/**", "tools/build_site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: sh tools/build_site.sh _site   # 문서 머리말(doctype·viewport)을 붙인 공개용 폴더
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
