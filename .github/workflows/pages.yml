# 관람객 웹(web/app/)을 GitHub Pages로 공개한다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 설정하면, main 에 올릴 때마다 자동 배포된다.
name: 웹 공개 (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/app
      - id: deployment
        uses: actions/deploy-pages@v4
