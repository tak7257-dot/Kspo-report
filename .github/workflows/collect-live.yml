# 실시간 주차현황을 매시간(10분 간격 6번) 기록해 data/live/ 에 쌓는다.
# 쌓인 2026년 기록으로 공연 날 패턴·오늘 예보를 해마다 다시 계산할 수 있다 (2028년까지 운영 근거).
# 주의: 공개 저장소의 예약 실행은 60일 동안 저장소 활동이 없으면 GitHub이 멈춘다 → Actions 화면에서 다시 켜면 된다.
name: 실시간 주차 기록

on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분 (UTC 기준, 정각 혼잡 피함)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-live
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/collect_live.sh
      - name: 기록 올리기
        run: |
          git config user.name "deolbumbilttae-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet && exit 0
          git commit -m "실시간 주차 기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H시')"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
